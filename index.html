<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ff4f91">
<title>Happy Birthday Easin! 🎂❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap');

:root{
  --pink:#ff4f91;
  --deep:#d91d5a;
  --soft:#fff3f8;
  --ink:#322832;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Hind Siliguri",sans-serif}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.35) 0 2px, transparent 3px),
    radial-gradient(circle at 78% 28%, rgba(255,255,255,.28) 0 2px, transparent 3px),
    linear-gradient(180deg,#f7c7d9 0%,#f28bb8 45%,#e93d92 100%);
  color:var(--ink);
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;
  background-image:url("assets/background.jpg");
  background-size:cover;background-position:center;
  mix-blend-mode:soft-light;
}

.stage{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:28px 16px 70px;
  position:relative;
}
.panel{
  width:min(1120px,94vw);
  min-height:min(720px,88vh);
  position:relative;
  overflow:hidden;
  border-radius:30px;
  background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,233,244,.94));
  box-shadow:0 30px 90px rgba(90,0,45,.28), inset 0 0 0 1px rgba(255,255,255,.7);
  isolation:isolate;
}
.panel::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,255,255,.85),transparent 28%),
    radial-gradient(circle at 10% 90%,rgba(255,126,177,.2),transparent 28%),
    radial-gradient(circle at 90% 90%,rgba(255,203,92,.16),transparent 25%);
  z-index:-1;
}
.garland{
  position:absolute;left:0;right:0;top:0;height:105px;
  display:flex;justify-content:center;align-items:flex-start;
  overflow:hidden;z-index:4;
}
.garland img{width:min(900px,94%);height:auto;filter:drop-shadow(0 6px 4px rgba(100,0,50,.1))}
.balloons{
  position:absolute;top:58px;left:20px;right:20px;height:230px;z-index:2;pointer-events:none;
}
.balloon{
  position:absolute;width:125px;animation:float 4s ease-in-out infinite;
  filter:drop-shadow(0 14px 12px rgba(90,0,60,.14));
}
.balloon.left{left:10px;transform:rotate(-8deg)}
.balloon.right{right:10px;transform:scaleX(-1) rotate(-8deg);animation-delay:1s}
@keyframes float{50%{transform:translateY(-12px) rotate(3deg)}}
.balloon.right{animation-name:floatR}
@keyframes floatR{50%{transform:scaleX(-1) translateY(-12px) rotate(3deg)}}

.sparkles{position:absolute;inset:0;pointer-events:none;z-index:1}
.sparkle{
  position:absolute;width:6px;height:6px;border-radius:50%;background:white;
  box-shadow:0 0 12px white;animation:twinkle 2.2s ease-in-out infinite;
}
@keyframes twinkle{50%{opacity:.25;transform:scale(.45)}}

.hero{
  min-height:720px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:125px 30px 35px;position:relative;z-index:3;
}
.hero h1{
  margin:0;
  font-family:"Dancing Script",cursive;
  font-size:clamp(4rem,10vw,8.6rem);
  line-height:.82;color:#f12968;
  text-shadow:0 5px 0 white,0 12px 22px rgba(220,20,80,.2);
  animation:titleIn 1.2s cubic-bezier(.2,.8,.2,1) both;
}
.hero .subtitle{
  margin:14px 0 0;font-size:clamp(1rem,2.2vw,1.35rem);
  color:#7b4b60;font-weight:600;
  animation:fadeUp .9s .35s both;
}
.cake-wrap{
  margin-top:18px;position:relative;cursor:pointer;
  animation:cakeIn 1s .55s both;
}
.cake{width:min(360px,58vw);filter:drop-shadow(0 22px 18px rgba(80,0,40,.18))}
.cake-wrap::after{
  content:"";position:absolute;left:50%;top:4%;width:10px;height:55px;
  transform:translateX(-50%);border-radius:10px;
  background:linear-gradient(#fff7aa 0 45%,#ff8c42 46%);
  box-shadow:0 0 18px #ffd75e;opacity:.9;
}
.tap{
  margin-top:-2px;font-size:.9rem;color:#9b6177;
  animation:pulse 1.8s infinite;
}
@keyframes pulse{50%{opacity:.5}}
@keyframes titleIn{from{opacity:0;transform:scale(.65) translateY(25px)}to{opacity:1;transform:none}}
@keyframes cakeIn{from{opacity:0;transform:translateY(40px) scale(.8)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}

.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:18px;animation:fadeUp .9s .8s both}
button{
  border:0;border-radius:999px;padding:13px 20px;font:600 1rem "Hind Siliguri",sans-serif;
  cursor:pointer;transition:.25s;box-shadow:0 9px 22px rgba(180,30,90,.15)
}
.primary{background:linear-gradient(135deg,#ff4f91,#e92768);color:#fff}
.secondary{background:#fff;color:#d72867}
button:hover{transform:translateY(-3px);box-shadow:0 13px 26px rgba(180,30,90,.22)}
.footer{
  position:absolute;bottom:12px;left:0;right:0;text-align:center;
  font-size:.78rem;color:#b05b7c;z-index:5
}

/* modal / letter */
.overlay{
  position:fixed;inset:0;background:rgba(30,5,20,.72);backdrop-filter:blur(9px);
  display:none;place-items:center;padding:18px;z-index:100;
}
.overlay.open{display:grid;animation:fade .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.letter{
  width:min(1040px,96vw);height:min(720px,92vh);
  display:grid;grid-template-columns:38% 62%;
  border-radius:25px;overflow:hidden;background:#fff;
  box-shadow:0 30px 100px rgba(0,0,0,.4);
  animation:letterIn .55s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes letterIn{from{transform:scale(.88) translateY(25px);opacity:0}to{transform:none;opacity:1}}
.letter-left{
  position:relative;padding:34px 28px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:linear-gradient(150deg,#ff4f91,#f12469);
  color:#fff;overflow:hidden;
}
.letter-left::before{
  content:"";position:absolute;width:430px;height:430px;border-radius:50%;
  background:rgba(255,255,255,.13);top:-170px;left:-150px;
}
.photo{
  width:min(250px,70%);aspect-ratio:3/4;object-fit:cover;border-radius:22px;
  border:6px solid #fff;box-shadow:0 18px 40px rgba(75,0,35,.3);z-index:1
}
.letter-left h2{font-family:"Dancing Script";font-size:2.7rem;margin:18px 0 3px;z-index:1}
.letter-left p{margin:0;opacity:.9;z-index:1}
.mini-cute{position:absolute;width:90px;bottom:10px;right:4px;transform:rotate(8deg)}
.letter-right{
  position:relative;padding:45px 54px 36px;overflow:auto;
  background:linear-gradient(135deg,#fffafd,#ffeaf3)
}
.close{
  position:absolute;right:16px;top:12px;width:42px;height:42px;padding:0;
  background:#fff;color:#d52a65;font-size:25px;z-index:3
}
.letter-right h3{
  margin:0 0 8px;font-family:"Dancing Script";font-size:3rem;color:#e52d6b
}
.letter-right .hello{font-weight:700;color:#7b4b60;margin-bottom:18px}
.message{
  white-space:pre-line;font-size:1.1rem;line-height:1.9;color:#45363e;
  min-height:250px
}
.signature{
  margin-top:22px;text-align:right;font-family:"Dancing Script";
  color:#f13c79;font-size:2.6rem
}
.replay{margin-top:15px;background:#fff0f6;color:#d92b69}

/* confetti */
.confetti{position:fixed;top:-20px;width:10px;height:16px;z-index:200;pointer-events:none}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(760deg);opacity:.9}}
.heart{
  position:fixed;pointer-events:none;z-index:210;font-size:22px;
  animation:heartFly 1.4s ease-out forwards
}
@keyframes heartFly{to{transform:translateY(-150px) scale(1.7);opacity:0}}

@media(max-width:760px){
  .panel{min-height:92vh;border-radius:20px}
  .hero{min-height:92vh;padding:110px 18px 40px}
  .balloons{top:55px}.balloon{width:82px}
  .garland{height:75px}
  .hero h1{font-size:clamp(3.6rem,17vw,5.8rem)}
  .cake{width:min(300px,72vw)}
  .letter{height:94vh;grid-template-columns:1fr;grid-template-rows:42% 58%}
  .letter-left{padding:15px}
  .photo{width:130px;height:170px}
  .letter-left h2{font-size:2rem;margin:8px 0 0}
  .letter-left p{font-size:.85rem}
  .mini-cute{width:55px}
  .letter-right{padding:35px 23px 25px}
  .letter-right h3{font-size:2.35rem}
  .message{font-size:.98rem;line-height:1.75}
  .signature{font-size:2.1rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition:none!important}
}
</style>
</head>
<body>
<div class="stage">
  <main class="panel">
    <div class="sparkles" id="sparkles"></div>

    <div class="garland">
      <img src="assets/flag.png" alt="Birthday decoration">
    </div>

    <div class="balloons">
      <img class="balloon left" src="assets/balloons.png" alt="">
      <img class="balloon right" src="assets/balloons.png" alt="">
    </div>

    <section class="hero">
      <h1>Happy Birthday</h1>
      <div class="subtitle">Easin! 🎂✨ Today is your special day.</div>

      <div class="cake-wrap" id="cakeButton" title="Click the cake">
        <img class="cake" src="assets/cake.png" alt="Birthday cake">
      </div>
      <div class="tap">🎂 Tap the cake for a surprise 🎂</div>

      <div class="actions">
        <button class="primary" id="openLetter">💌 Open My Letter</button>
        <button class="secondary" id="celebrate">🎉 Celebrate!</button>
      </div>
    </section>

    <div class="footer">Made with ❤️ for Easin</div>
  </main>
</div>

<div class="overlay" id="overlay">
  <section class="letter" role="dialog" aria-modal="true" aria-label="Birthday letter">
    <aside class="letter-left">
      <img class="photo" src="assets/photo.png" alt="Birthday memory">
      <h2>Happy Birthday, Easin! 🎉</h2>
      <p>To my best friend ❤️</p>
      <img class="mini-cute" src="assets/cute.png" alt="">
    </aside>

    <article class="letter-right">
      <button class="close" id="closeLetter" aria-label="Close">×</button>
      <h3>Dear Easin,</h3>
      <div class="hello">আজকের দিনটা শুধু তোর জন্য! 🥳</div>
      <div class="message" id="message"></div>
      <div class="signature">Yours Friend Estiak ❤️</div>
      <button class="replay" id="replay">✨ Read Again</button>
    </article>
  </section>
</div>

<script>
const messageText = `আজকের এই বিশেষ দিনে তোকে জানাই অনেক অনেক শুভেচ্ছা! 🎂❤️

জীবনের নতুন একটা বছর শুরু হলো তোর। আশা করি এই বছরটা তোর জন্য অনেক আনন্দ, সফলতা আর সুন্দর সুন্দর স্মৃতিতে ভরে উঠবে। ✨

তোর সব স্বপ্ন এক এক করে পূরণ হোক, জীবনে যত বাধাই আসুক—তুই যেন সবসময় হাসিমুখে সেগুলো পার করে সামনে এগিয়ে যেতে পারিস। 🤍

আমাদের বন্ধুত্বটা যেন এভাবেই সবসময় থাকে—অনেক আড্ডা, পাগলামি, হাসি আর অসংখ্য সুন্দর স্মৃতি নিয়ে। 😂🫶

সবসময় ভালো থাকিস, কি ভাবছিস আমি এই সব বলবো তোকে বোকাচোদা। 😂😂😂😂😂

Happy Birthday once again, Easin! 🥳🎉
Have an amazing year ahead! ✨`;

const overlay = document.getElementById("overlay");
const message = document.getElementById("message");
const openLetter = document.getElementById("openLetter");
const closeLetter = document.getElementById("closeLetter");
const replay = document.getElementById("replay");

function typeMessage(){
  message.textContent = "";
  let i = 0;
  const speed = 18;
  function tick(){
    if(i < messageText.length){
      message.textContent += messageText[i++];
      setTimeout(tick, speed);
    }
  }
  tick();
}
function openMail(){
  overlay.classList.add("open");
  burst(90);
  setTimeout(typeMessage, 450);
}
function closeMail(){ overlay.classList.remove("open"); }

openLetter.onclick = openMail;
closeLetter.onclick = closeMail;
replay.onclick = typeMessage;
overlay.addEventListener("click",e=>{if(e.target===overlay)closeMail()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMail()});

function burst(count=70){
  const pieces=["#ff3d78","#ffd34e","#43b9ff","#7c4dff","#35d07f","#ff8a3d"];
  for(let i=0;i<count;i++){
    const el=document.createElement("span");
    el.className="confetti";
    el.style.left=(Math.random()*100)+"vw";
    el.style.background=pieces[Math.floor(Math.random()*pieces.length)];
    el.style.width=(5+Math.random()*8)+"px";
    el.style.height=(7+Math.random()*13)+"px";
    el.style.setProperty("--x",((Math.random()-.5)*260)+"px");
    el.style.animation=`fall ${2.2+Math.random()*2.6}s linear forwards`;
    el.style.animationDelay=(Math.random()*.5)+"s";
    el.style.transform=`rotate(${Math.random()*180}deg)`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),5200);
  }
}
function hearts(n=18){
  for(let i=0;i<n;i++){
    const h=document.createElement("span");
    h.className="heart";h.textContent="❤";
    h.style.left=(20+Math.random()*60)+"vw";
    h.style.top=(55+Math.random()*30)+"vh";
    h.style.color=["#ff3975","#ff6e9c","#fff","#e52d6b"][Math.floor(Math.random()*4)];
    h.style.animationDelay=(Math.random()*.6)+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }
}
document.getElementById("celebrate").onclick=()=>{
  burst(130);hearts(28);
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784,1047].forEach((freq,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.frequency.value=freq;o.type="sine";
      g.gain.setValueAtTime(.0001,ctx.currentTime+i*.12);
      g.gain.exponentialRampToValueAtTime(.07,ctx.currentTime+i*.12+.02);
      g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+i*.12+.22);
      o.connect(g);g.connect(ctx.destination);o.start(ctx.currentTime+i*.12);o.stop(ctx.currentTime+i*.12+.25);
    });
  }catch(e){}
};
document.getElementById("cakeButton").onclick=()=>{
  burst(170);hearts(35);
  setTimeout(openMail,700);
};

const sparkleBox=document.getElementById("sparkles");
for(let i=0;i<45;i++){
  const s=document.createElement("i");
  s.className="sparkle";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.animationDelay=(Math.random()*2.5)+"s";
  s.style.opacity=.25+Math.random()*.7;
  sparkleBox.appendChild(s);
}
setTimeout(()=>burst(45),700);
</script>
</body>
</html>
